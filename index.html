<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>body{margin:0}</style></head><body><title>A Note For Afef</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Fraunces:ital,opsz,wght@1,9..144,500;1,9..144,600&family=IBM+Plex+Mono:wght@400;600&family=DM+Sans:wght@400;500&display=swap">
<style>
/* Layout: a single boarding pass she "boards" each day to reveal the note and a sticker; earlier flights logged below */
:root{
  --bg:#eef1f6; --paper:#ffffff; --ink:#1b2340; --muted:#6c7391;
  --accent:#d6394f; --stub:#1b2340; --stubInk:#f3f4fa; --line:#dfe3ee; --sky:#dbe7f7; --cloud:#7d86a6;
  --hand:"Caveat","Segoe Script",cursive;
  --serif:"Fraunces",Georgia,serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
  --sans:"DM Sans",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1426; --paper:#1a2140; --ink:#eef0fa; --muted:#9aa2c4;
  --accent:#ff6b7f; --stub:#d6394f; --stubInk:#fff; --line:#2b3459; --sky:#121a35; --cloud:#5d6790; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1426; --paper:#1a2140; --ink:#eef0fa; --muted:#9aa2c4;
  --accent:#ff6b7f; --stub:#d6394f; --stubInk:#fff; --line:#2b3459; --sky:#121a35; --cloud:#5d6790; color-scheme:dark}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55}
.wrap{max-width:520px;margin:0 auto;padding:36px 16px 64px;display:flex;flex-direction:column;gap:24px}
header{display:flex;flex-direction:column;gap:2px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--serif);font-style:italic;font-weight:600;font-size:clamp(30px,8vw,40px);line-height:1.1;margin:0;text-wrap:balance}
h1 em{color:var(--accent);font-style:italic}

.pass{background:var(--paper);border-radius:16px;box-shadow:0 22px 44px -26px rgba(20,30,70,.55);overflow:hidden;
  display:flex;flex-direction:column}
.top{background:var(--stub);color:var(--stubInk);padding:14px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px;
  font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase}
.top b{font-weight:600}
.route{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:20px 18px 6px;gap:8px}
.city{display:flex;flex-direction:column;min-width:0}
.city.r{text-align:right}
.code{font-family:var(--mono);font-weight:600;font-size:clamp(30px,9vw,40px);line-height:1}
.cname{font-size:12px;color:var(--muted)}
.plane{width:44px;height:20px;color:var(--accent)}
.fields{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:14px 18px 18px}
.f{display:flex;flex-direction:column;min-width:0}
.f span{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.f b{font-family:var(--mono);font-weight:600;font-size:15px;font-variant-numeric:tabular-nums}
.perf{position:relative;border-top:2px dashed var(--line);margin:0 14px}
.perf::before,.perf::after{content:"";position:absolute;top:-12px;width:22px;height:22px;border-radius:50%;background:var(--bg)}
.perf::before{left:-26px}.perf::after{right:-26px}

.board{all:unset;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px 18px 18px}
.board:focus-visible{outline:2px solid var(--accent);outline-offset:-4px;border-radius:12px}
.barcode{height:44px;flex:1;min-width:0;background:repeating-linear-gradient(90deg,var(--ink) 0 2px,transparent 2px 4px,var(--ink) 4px 5px,transparent 5px 9px,var(--ink) 9px 12px,transparent 12px 14px);opacity:.85}
.btn{background:var(--accent);color:#fff;font-weight:500;padding:12px 20px;border-radius:999px;white-space:nowrap;transition:transform .2s}
.board:hover .btn{transform:translateY(-2px)}

.note{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:end;padding:18px 18px 20px;animation:rise .5s ease-out}
@keyframes rise{from{transform:translateY(10px)}to{transform:none}}
.note .lbl{grid-column:1/-1;font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.note p{font-family:var(--hand);font-size:clamp(25px,6.4vw,30px);line-height:1.2;margin:0;min-width:0}
.note img{width:clamp(96px,28vw,130px);height:auto;transform:rotate(4deg);filter:drop-shadow(0 6px 10px rgba(20,30,70,.3))}
.note .sign{grid-column:1/-1;font-family:var(--hand);font-size:24px;color:var(--accent);text-align:right}

.game{padding:14px 14px 16px;display:flex;flex-direction:column;gap:10px}
.hud{display:flex;align-items:center;gap:12px;font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.hud span:first-child{white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--ink);font-weight:600}
.bar{flex:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s}
#cv{width:100%;height:380px;max-width:100%;border-radius:12px;background:var(--sky);touch-action:none;display:block;cursor:grab}
.hint{font-size:13px;color:var(--muted);text-align:center}
.replay{all:unset;cursor:pointer;font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);text-align:center;padding:4px 6px 16px}
.replay:focus-visible{outline:2px solid var(--accent);border-radius:6px}
.next{text-align:center;font-family:var(--mono);font-size:12px;letter-spacing:.08em;color:var(--muted)}
.next b{color:var(--ink);font-weight:600}

.past h2{font-family:var(--serif);font-style:italic;font-weight:500;font-size:21px;margin:0 0 8px}
.past ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.past li{border-top:1px solid var(--line);padding:12px 0;display:grid;grid-template-columns:52px 1fr 44px;gap:12px;align-items:center}
.past .d{font-family:var(--mono);font-size:11px;color:var(--accent);font-variant-numeric:tabular-nums;line-height:1.3}
.past .t{font-family:var(--hand);font-size:21px;line-height:1.25;min-width:0}
.past img{width:44px;height:auto}
@media (max-width:380px){.fields{grid-template-columns:repeat(2,1fr)}}
@media (prefers-reduced-motion:reduce){.note{animation:none}.btn{transition:none}}
</style>

<div class="wrap">
  <header>
    <div class="eyebrow" id="dateLabel"></div>
    <h1 id="greet"></h1>
  </header>

  <div class="pass">
    <div class="top"><span>Boarding pass</span><b id="flight"></b></div>
    <div class="route">
      <div class="city"><span class="code">HTM</span><span class="cname">Haithem's heart</span></div>
      <svg class="plane" viewBox="0 0 44 20" aria-hidden="true"><path d="M0 10h14" stroke="currentColor" stroke-width="2" stroke-dasharray="3 3" fill="none"/><path d="M18 9 L28 9 L34 2 L37 2 L34 9 L41 9 L43 7 L44 7 L43 10 L44 13 L43 13 L41 11 L34 11 L37 18 L34 18 L28 11 L18 11 Z" fill="currentColor"/></svg>
      <div class="city r"><span class="code">AFF</span><span class="cname">Afef, wherever she lands</span></div>
    </div>
    <div class="fields">
      <div class="f"><span>Passenger</span><b>AFEF</b></div>
      <div class="f"><span>Seat</span><b>1A</b></div>
      <div class="f"><span>Gate</span><b>H</b></div>
      <div class="f"><span>Class</span><b>FIRST</b></div>
    </div>
    <div class="perf"></div>
    <button class="board" id="board" type="button" aria-label="Start the game to unlock today's note">
      <div class="barcode"></div><span class="btn">Take off</span>
    </button>
    <div class="game" id="game" hidden>
      <div class="hud"><span id="hudScore">Hearts 0/10</span><span class="bar"><i id="hudBar"></i></span></div>
      <canvas id="cv" aria-label="Catch the hearts game"></canvas>
      <div class="hint" id="hint">Drag the plane to catch hearts. Dodge the storms. Afef stickers count double.</div>
    </div>
    <div class="note" id="note" hidden>
      <div class="lbl" id="lbl"></div>
      <p id="text"></p>
      <img id="stk" alt="">
      <div class="sign">— Haithem</div>
    </div>
  </div>

  <div class="next" id="next"></div>

  <section class="past" id="past" hidden>
    <h2>Previous flights</h2>
    <ul id="pastList"></ul>
  </section>
</div>

const today = new Date(); today.setHours(0,0,0,0);
const start = new Date(START+"T00:00:00");
const dayIdx = Math.max(0, Math.round((today - start)/86400000));
const pick = i => NOTES[i % NOTES.length];
const STK_MAP = {0:3, 12:1, 21:8};
const stk = i => STICKERS[(i in STK_MAP ? STK_MAP[i] : i) % STICKERS.length];
const fmt = d => d.toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long"});
const short = d => d.toLocaleDateString("en-GB",{day:"numeric",month:"short"});
const pad = n => String(n).padStart(3,"0");

document.getElementById("dateLabel").textContent = fmt(today);
const h = new Date().getHours();
const part = h < 12 ? "Good morning" : h < 18 ? "Good afternoon" : "Good evening";
document.getElementById("greet").innerHTML = `${part}, <em>Afef</em>`;
document.getElementById("flight").textContent = `Flight AF ${pad(dayIdx+1)}`;

const $ = id => document.getElementById(id);
function openNote(){
  $("board").hidden = true;
  $("game").hidden = true;
  $("note").hidden = false;
  if(!$("replay")){
    const b = document.createElement("button");
    b.id = "replay"; b.className = "replay"; b.type = "button"; b.textContent = "Fly again";
    b.addEventListener("click", startGame);
    $("note").after(b);
  }
  $("replay").hidden = false;
  document.getElementById("lbl").textContent = `Note ${dayIdx+1} · ${short(today)}`;
  document.getElementById("text").textContent = pick(dayIdx);
  document.getElementById("stk").src = stk(dayIdx);
  const ms = new Date(today.getTime()+86400000) - new Date();
  const hrs = Math.floor(ms/3600000), mins = Math.floor(ms%3600000/60000);
  document.getElementById("next").innerHTML = `Next flight departs in <b>${hrs}h ${mins}m</b>`;
  try{ localStorage.setItem("opened", String(dayIdx)); }catch(e){}
}
// ---------- Mini game: catch 10 hearts to land ----------
const GOAL = 10;
const cv = $("cv"), ctx = cv.getContext("2d");
const imgs = STICKERS.map(src => { const im = new Image(); im.src = src; return im; });
let W = 0, H = 380, plane, items, score, raf, lastSpawn, lastT, running = false, shake = 0, done = false, elapsed = 0;
const col = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

function size(){
  const dpr = window.devicePixelRatio || 1;
  W = cv.clientWidth; H = cv.clientHeight;
  cv.width = W*dpr; cv.height = H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
}
function startGame(){
  $("board").hidden = true; $("note").hidden = true;
  if($("replay")) $("replay").hidden = true;
  $("game").hidden = false;
  size();
  plane = {x:W/2, tx:W/2, y:H-56};
  items = []; score = 0; lastSpawn = 0; lastT = performance.now(); elapsed = 0; done = false; shake = 0;
  updateHud(); $("hint").textContent = "Drag the plane to catch hearts. Dodge the storms. Afef stickers count double.";
  running = true; cancelAnimationFrame(raf); raf = requestAnimationFrame(loop);
}
function updateHud(){
  $("hudScore").textContent = `Hearts ${Math.min(score,GOAL)}/${GOAL}`;
  $("hudBar").style.width = Math.min(100, score/GOAL*100) + "%";
}
function spawn(){
  const r = Math.random();
  const type = r < .66 ? "heart" : r < .88 ? "storm" : "sticker";
  const sz = type==="sticker" ? 46 : type==="storm" ? 30 : 15;
  items.push({type, x: 24 + Math.random()*(W-48), y: -40, sz,
    vy: (1.6 + Math.random()*1.1 + elapsed/40000) * (type==="storm" ? 1.15 : 1),
    img: type==="sticker" ? imgs[Math.floor(Math.random()*imgs.length)] : null, wob: Math.random()*6});
}
function heart(x,y,s,c){
  ctx.fillStyle = c; ctx.beginPath();
  ctx.moveTo(x, y+s*.35);
  ctx.bezierCurveTo(x, y-s*.3, x-s, y-s*.3, x-s, y+s*.15);
  ctx.bezierCurveTo(x-s, y+s*.6, x, y+s*.9, x, y+s*1.15);
  ctx.bezierCurveTo(x, y+s*.9, x+s, y+s*.6, x+s, y+s*.15);
  ctx.bezierCurveTo(x+s, y-s*.3, x, y-s*.3, x, y+s*.35);
  ctx.fill();
}
function storm(x,y,s,c){
  ctx.fillStyle = c; ctx.beginPath();
  ctx.arc(x-s*.5,y,s*.55,0,7); ctx.arc(x+s*.1,y-s*.3,s*.7,0,7); ctx.arc(x+s*.65,y+s*.05,s*.5,0,7);
  ctx.fill();
  ctx.fillStyle = "#f5c542"; ctx.beginPath();
  ctx.moveTo(x,y+s*.3); ctx.lineTo(x-s*.25,y+s*.9); ctx.lineTo(x,y+s*.85); ctx.lineTo(x-s*.15,y+s*1.4); ctx.lineTo(x+s*.25,y+s*.7); ctx.lineTo(x,y+s*.75); ctx.closePath(); ctx.fill();
}
function drawPlane(x,y,c){
  ctx.save(); ctx.translate(x,y); ctx.fillStyle = c;
  ctx.beginPath(); ctx.ellipse(0,0,7,28,0,0,7); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-30,6); ctx.lineTo(0,-6); ctx.lineTo(30,6); ctx.lineTo(30,11); ctx.lineTo(0,4); ctx.lineTo(-30,11); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-12,24); ctx.lineTo(0,18); ctx.lineTo(12,24); ctx.lineTo(12,28); ctx.lineTo(-12,28); ctx.closePath(); ctx.fill();
  ctx.restore();
}
function loop(t){
  if(!running) return;
  const dt = Math.min(40, t - lastT); lastT = t; elapsed += dt;
  const k = dt/16.7;
  if(!done && t - lastSpawn > 620){ spawn(); lastSpawn = t; }
  plane.x += (plane.tx - plane.x) * Math.min(1, .22*k);
  const accent = col("--accent"), ink = col("--ink"), cloud = col("--cloud");
  ctx.clearRect(0,0,W,H);
  // speed lines
  ctx.strokeStyle = col("--line"); ctx.lineWidth = 1;
  for(let i=0;i<6;i++){ const lx = (i*W/6 + 20) % W, ly = ((elapsed*.25) + i*97) % (H+60) - 30; ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(lx,ly+28); ctx.stroke(); }
  for(const it of items){
    it.y += it.vy * k; it.wob += .05*k;
    const x = it.x + Math.sin(it.wob)*6;
    if(it.type==="heart") heart(x,it.y,it.sz,accent);
    else if(it.type==="storm") storm(x,it.y,it.sz,cloud);
    else if(it.img.complete){ const h = it.sz*1.5, w = h*it.img.width/it.img.height; ctx.drawImage(it.img, x-w/2, it.y-h/2, w, h); }
    const dx = x - plane.x, dy = it.y - plane.y;
    if(!it.hit && !done && Math.abs(dx) < it.sz*.7 + 22 && Math.abs(dy) < it.sz*.7 + 20){
      it.hit = true;
      if(it.type==="heart") score += 1;
      else if(it.type==="sticker") score += 2;
      else { score = Math.max(0, score-1); shake = 12; }
      updateHud();
      if(score >= GOAL) land();
    }
  }
  items = items.filter(it => !it.hit && it.y < H + 60);
  const sx = shake ? (Math.random()-.5)*shake : 0; shake = Math.max(0, shake - k);
  drawPlane(plane.x + sx, plane.y, shake ? cloud : ink);
  if(done){
    ctx.fillStyle = ink; ctx.font = "600 22px 'IBM Plex Mono', monospace"; ctx.textAlign = "center";
    ctx.fillText("Landed. Welcome, Afef.", W/2, H/2);
    plane.y -= 2*k;
  }
  raf = requestAnimationFrame(loop);
}
function land(){
  done = true; items = [];
  $("hint").textContent = "Unlocking today's note...";
  setTimeout(() => { running = false; cancelAnimationFrame(raf); openNote(); }, 1300);
}
function aim(e){
  const r = cv.getBoundingClientRect();
  plane.tx = Math.max(30, Math.min(W-30, e.clientX - r.left));
}
cv.addEventListener("pointerdown", e => { aim(e); cv.setPointerCapture(e.pointerId); });
cv.addEventListener("pointermove", e => { if(e.pointerType==="mouse" || e.buttons) aim(e); });
window.addEventListener("keydown", e => {
  if(!running) return;
  if(e.key==="ArrowLeft") plane.tx = Math.max(30, plane.tx-40);
  if(e.key==="ArrowRight") plane.tx = Math.min(W-30, plane.tx+40);
});
window.addEventListener("resize", () => { if(running) size(); });

$("board").addEventListener("click", startGame);
try{ if(localStorage.getItem("opened")===String(dayIdx)) openNote(); }catch(e){}

if(dayIdx > 0){
  const list = document.getElementById("pastList");
  for(let i = dayIdx-1; i >= Math.max(0, dayIdx-7); i--){
    const d = new Date(start.getTime()+i*86400000);
    const li = document.createElement("li");
    li.innerHTML = `<span class="d">AF ${pad(i+1)}<br>${short(d)}</span><span class="t"></span><img alt="">`;
    li.querySelector(".t").textContent = pick(i);
    li.querySelector("img").src = stk(i);
    list.appendChild(li);
  }
  document.getElementById("past").hidden = false;
}
</script>
</body></html>
